project_id = "thdoggygang"

[auth]
site_url = "https://www.thedoggygang.com"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://thdoggygang.vercel.app/**",
  "https://www.thedoggygang.com/**",
]
enable_signup = true

[auth.rate_limit]
# Custom SMTP starts conservatively; increase later if real demand requires it.
email_sent = 30

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "acceso@thedoggygang.com"
sender_name = "The Doggy Gang"

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Tu código de acceso a The Doggy Gang es {{ .Code }}"
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Tu acceso a The Doggy Gang"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Bienvenida a The Doggy Gang"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirma tu correo | The Doggy Gang"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupera tu acceso | The Doggy Gang"
content_path = "./supabase/templates/recovery.html"
